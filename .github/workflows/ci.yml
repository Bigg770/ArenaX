name: CI

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  # Frontend CI
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci

    - name: Check PWA assets
      run: npm run check:pwa-assets

    - name: Lint code
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test -- --ci --forceExit --passWithNoTests

    - name: Build
      run: npm run build
      env:
        NODE_ENV: production

  # Server (TypeScript) CI
  server:
    name: Server
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./server
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npm run prisma:generate
    
    - name: Type check (Lint)
      run: npm run lint
    
    - name: Build
      run: npm run build

  # Backend database migration CI
  backend-migrations:
    name: Backend Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: arenax
          POSTGRES_PASSWORD: arenax
          POSTGRES_DB: arenax_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenax -d arenax_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://arenax:arenax@localhost:5432/arenax_ci
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/sqlx
        key: ${{ runner.os }}-cargo-sqlx-cli-${{ hashFiles('backend/Cargo.lock') }}

    - name: Install SQLx CLI
      run: |
        if ! command -v sqlx >/dev/null 2>&1; then
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
        fi

    - name: Verify migration files
      run: ./scripts/verify-migrations.sh

    - name: Apply migrations
      run: ./scripts/migrate.sh

    - name: Rollback verification (up -> down -> up, #871)
      env:
        SKIP_BACKUP: "1"  # CI database is disposable; never skip the backup on shared data
      run: |
        chmod +x ./scripts/rollback-verify.sh
        ./scripts/rollback-verify.sh

  # Backend (Rust) build & test
  #
  # Before this job the Rust backend was never compiled in CI — the
  # `backend-migrations` job above only applies migrations — so `backend/` could
  # rot without any check noticing.
  #
  # `continue-on-error` is deliberately true for now: `main` does not currently
  # compile, so a blocking job would fail every unrelated PR. Once the backend
  # builds green, delete `continue-on-error` and make this a required check.
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arenax
          POSTGRES_PASSWORD: arenax
          POSTGRES_DB: arenax_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenax -d arenax_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The realtime/session tests connect to Redis at 127.0.0.1:6379.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `sqlx::query!` macros type-check against a live, migrated database, so
      # DATABASE_URL must be reachable at compile time, not just at runtime.
      DATABASE_URL: postgres://arenax:arenax@localhost:5432/arenax_ci
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Same key as `backend-migrations` so the compiled-in sqlx-cli binary is
    # shared between the two jobs instead of installed twice.
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/sqlx
        key: ${{ runner.os }}-cargo-sqlx-cli-${{ hashFiles('backend/Cargo.lock') }}

    - name: Cache backend target
      uses: actions/cache@v3
      with:
        path: backend/target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-

    - name: Install SQLx CLI
      run: |
        if ! command -v sqlx >/dev/null 2>&1; then
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
        fi

    - name: Apply migrations
      run: ./scripts/migrate.sh

    - name: Type check
      run: cargo check --all-targets --locked

    - name: Run tests
      run: cargo test --all-targets --locked

  # Contracts CI (Rust)
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./contracts
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          contracts/target
        key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build contracts
      run: cargo build --target wasm32-unknown-unknown --release
    
    - name: Run tests
      run: cargo test

  # Contract security analysis release gate (#110)
  #
  # Blocks publication of Wasm artifacts when high-risk findings remain
  # unresolved. Findings are scoped to contract code (contracts/) and cover
  # unsafe authorization, arithmetic, storage, and dependency patterns.
  #
  # Severity policy:
  #   - critical/high  -> block release (or require a reviewed exception)
  #   - medium/low     -> report only, tracked but non-blocking
  #
  # Tool versions and reports are retained as release artifacts so a release
  # can be audited against the exact toolchain that produced it.
  contract-security:
    name: Contract Security Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          contracts/target
        key: ${{ runner.os }}-cargo-contracts-security-${{ hashFiles('contracts/Cargo.lock') }}

    - name: Record tool versions
      run: |
        mkdir -p security-reports
        {
          echo "rustc: $(rustc --version)"
          echo "cargo: $(cargo --version)"
          echo "clippy: $(cargo clippy --version)"
          echo "cargo-audit: $(cargo audit --version 2>/dev/null || echo 'not installed')"
          echo "cargo-deny: $(cargo deny --version 2>/dev/null || echo 'not installed')"
        } | tee security-reports/tool-versions.txt

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    # Dependency audit scoped to contract dependencies.
    - name: Dependency audit (cargo-audit)
      run: |
        cargo audit --json > security-reports/cargo-audit.json || true
        cargo audit | tee security-reports/cargo-audit.txt

    - name: Dependency policy (cargo-deny)
      run: |
        cargo deny check advisories bans sources 2>&1 | tee security-reports/cargo-deny.txt

    # Static analysis for unsafe authorization, arithmetic, and storage
    # patterns. Clippy lints are scoped to contract code only.
    - name: Static analysis (clippy, contract code)
      run: |
        cargo clippy --all-targets --all-features -- \
          -D warnings \
          -D clippy::arithmetic_side_effects \
          -D clippy::integer_arithmetic \
          -D clippy::unwrap_used \
          -D clippy::expect_used \
          -D clippy::panic \
          -D clippy::indexing_slicing \
          2>&1 | tee security-reports/clippy.txt

    # Review checklist tailored to contract call boundaries and upgrade paths.
    - name: Contract review checklist
      run: |
        cat > security-reports/review-checklist.md <<'EOF'
        # Contract Security Review Checklist (#110)

        ## Authorization / call boundaries
        - [ ] Every state-mutating entrypoint calls `require_auth()` on the
              correct address (not a caller-supplied, unverified address).
        - [ ] Cross-contract calls re-verify authorization on the callee side;
              callers are never trusted implicitly.
        - [ ] Admin/owner-only entrypoints check the stored admin, not an
              argument.

        ## Arithmetic
        - [ ] All balance/amount math uses checked or saturating operations.
        - [ ] No unchecked casts between integer widths.
        - [ ] Rounding direction favors the protocol, not the caller.

        ## Storage
        - [ ] Storage keys are namespaced and cannot collide across contracts.
        - [ ] Temporary vs persistent storage TTLs are set explicitly.
        - [ ] No unbounded iteration over user-controlled collections.

        ## Upgrade paths
        - [ ] Upgrade entrypoint is admin-gated and emits an event.
        - [ ] Storage schema migrations are handled on upgrade.
        - [ ] Old/new contract versions cannot be mixed in a way that breaks
              invariants.

        ## Dependencies
        - [ ] `cargo audit` reports no unresolved advisories.
        - [ ] `cargo deny` advisories/bans/sources checks pass.
        - [ ] Any exception is documented and reviewed below.

        ## Exceptions
        - [ ] High-risk findings are either fixed or have a reviewed exception
              recorded here with an approver and expiry.
        EOF
        cat security-reports/review-checklist.md

    # High-risk unresolved findings block the release. A reviewed exception is
    # expressed by setting the `SECURITY_EXCEPTION` env var on the job/PR.
    - name: Enforce severity policy
      run: |
        if [ -n "${SECURITY_EXCEPTION:-}" ]; then
          echo "Reviewed exception in effect: ${SECURITY_EXCEPTION}"
          exit 0
        fi
        if grep -qiE 'error|vulnerabilit|advisory' security-reports/cargo-audit.txt; then
          echo "::error::cargo-audit reported unresolved findings; release blocked."
          exit 1
        fi
        if grep -qiE '^error|denied|vulnerabilit' security-reports/cargo-deny.txt; then
          echo "::error::cargo-deny reported unresolved findings; release blocked."
          exit 1
        fi
        echo "No high-risk unresolved findings."

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: contract-security-reports
        path: contracts/security-reports/
        retention-days: 90

  # Cross-contract integration tests for settlement (#108)
  #
  # Deploys escrow, dispute, match, token, and prize contracts into a single
  # Soroban test environment and exercises the full deposit-to-final-payout
  # and dispute/refund paths, including authorization and transfer failures.
  # Kept as a separate job so the integration harness can be run and debugged
  # independently of the unit-test job above.
  contracts-integration:
    name: Contracts Integration (Settlement)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./contracts

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          contracts/target
        key: ${{ runner.

