name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test

  secret-rotation:
    name: Secret rotation rehearsal (issue #82)
    runs-on: ubuntu-latest
    # Rotation-related automated tests: verifies overlap windows, revoke order,
    # and that credential material is never logged. Runs on every PR so the
    # runbook stays backed by executable checks.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run secret rotation tests
        run: npm test -- --testPathPattern 'secret-rotation|rotation'
        env:
          # Placeholder values only; tests must not depend on real credentials.
          ROTATION_TEST_MODE: 'true'
