name: Database Backup

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: {}

# Least-privilege: only read repo contents; no write scopes needed.
permissions:
  contents: read

# Recovery objectives (see backend/BACKUP_RECOVERY.md):
#   RPO: 24h (daily full backup) — max acceptable data loss
#   RTO: 4h — max acceptable time to restore + validate + cut over
# This workflow enforces the RPO by failing loudly if a fresh, verified
# backup is not produced each day.

jobs:
  backup:
    name: Backup and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run backup (encrypted, access-limited)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          S3_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
          # Encryption key for at-rest backup encryption (age/gpg).
          BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          # Server-side encryption + retention for the backup bucket.
          BACKUP_SSE: AES256
          BACKUP_RETENTION_DAYS: '35'
        run: ./scripts/backup-database.sh

      - name: Independently verify backup integrity
        env:
          S3_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
        run: |
          # Independent integrity check: re-download the latest artifact and
          # verify its checksum against the manifest written at backup time.
          # This runs separately from backup creation so a corrupt upload or
          # truncated dump is caught even if the backup step "succeeded".
          ./scripts/verify-backup-integrity.sh --latest

      - name: Verify backup restores cleanly
        env:
          DATABASE_URL: ${{ secrets.DB_BACKUP_VERIFY_DATABASE_URL }}
          S3_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
        run: ./scripts/verify-backup.sh --latest

      - name: Enforce RPO freshness
        env:
          S3_BACKUP_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
        run: |
          # Fail if the newest verified backup is older than the 24h RPO.
          ./scripts/verify-backup-integrity.sh --max-age-hours 24

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily database backup or verification failed — see BACKUP_RECOVERY.md for the manual recovery procedure and escalate per server/infra/monitoring/ONCALL.md."
