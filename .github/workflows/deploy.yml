name: Deploy (blue/green)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      canary_weight:
        description: "Percent of traffic to send to the canary phase"
        default: "10"
      canary_bake_seconds:
        description: "Seconds to hold the canary split before full cutover"
        default: "60"

jobs:
  contract-security:
    name: Contract security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install audit tooling
        run: |
          cargo install cargo-audit --version 0.20.1 --locked
          cargo install cargo-deny --version 0.16.1 --locked

      - name: Dependency audit (contract dependencies)
        working-directory: backend
        run: |
          mkdir -p ../deploy/security
          cargo audit --json > ../deploy/security/cargo-audit.json || true
          cargo deny check advisories bans licenses sources 2>&1 | tee ../deploy/security/cargo-deny.txt || true

      - name: Static analysis (authorization, arithmetic, storage)
        working-directory: backend
        run: |
          cargo clippy --all-targets --all-features -- \
            -D clippy::arithmetic_side_effects \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -W clippy::indexing_slicing \
            2>&1 | tee ../deploy/security/clippy.txt

      - name: Evaluate findings against severity policy
        run: |
          python3 scripts/security/contract-security-gate.py \
            --audit deploy/security/cargo-audit.json \
            --deny deploy/security/cargo-deny.txt \
            --clippy deploy/security/clippy.txt \
            --policy deploy/security/severity-policy.json \
            --exceptions deploy/security/exceptions.json

      - name: Retain security reports with release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-security-reports-${{ github.sha }}
          path: deploy/security/
          retention-days: 90

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: contract-security
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue/green deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run blue/green deploy on the deploy host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/arenax
            git fetch --depth 1 origin main
            git checkout origin/main -- deploy scripts/deploy
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend
            export CANARY_WEIGHT=${{ github.event.inputs.canary_weight || '10' }}
            export CANARY_BAKE_SECONDS=${{ github.event.inputs.canary_bake_seconds || '60' }}
            ./scripts/deploy/blue-green-deploy.sh

      - name: Surface deployment metrics
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/arenax
            echo "Last 5 deployments:"
            tail -n 5 deploy/metrics/deployments.jsonl || true
