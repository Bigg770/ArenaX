name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, dev, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cicd.yml"
  pull_request:
    branches: [main, dev, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cicd.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./frontend

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────
  # Stage 1 – Lint
  # ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check PWA assets
        run: npm run check:pwa-assets

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # Stage 2 – Type Check
  # ─────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # Stage 3 – Unit & Integration Tests
  # ─────────────────────────────────────────────────────────
  unit-test:
    name: Unit / Integration Tests
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm run test -- --coverage --ci --forceExit --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Stage 4 – Production Build
  # ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      NODE_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            frontend/.next/
            frontend/public/
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # Stage 5 – E2E Tests (Playwright)
  # ─────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: frontend/

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-snapshots
          path: frontend/e2e/**/*.png
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Stage 5a – Visual Regression (high-risk interfaces)
  # ─────────────────────────────────────────────────────────
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: frontend/

      # Deterministic screenshots: fixed fonts, animations disabled, seeded data.
      # Baselines live in frontend/e2e/visual/*.spec.ts-snapshots/ and are
      # reviewed via the diff artifacts uploaded below.
      - name: Run visual regression tests
        run: npm run test:visual
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload visual regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: frontend/visual-report/
          retention-days: 14

      - name: Upload visual regression diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-diffs
          path: |
            frontend/test-results/**/*-diff.png
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-expected.png
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Stage 5b – Accessibility Gate (axe on core routes)
  # ─────────────────────────────────────────────────────────
  accessibility:
    name: Accessibility Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: frontend/

      # Fails CI on any critical/serious axe violation on the core routes.
      # Documented exceptions live in frontend/e2e/a11y/axe-exceptions.json
      # and are surfaced in the report artifact for review.
      - name: Run axe accessibility checks on core routes
        run: npm run test:a11y
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: frontend/a11y-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Stage 6 – Deploy to Staging (dev/develop branch only)
  # ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-test, visual-regression, accessibility]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop')
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: frontend/

      # Replace the step below with your actual deploy command
      # e.g., Vercel: npx vercel --token ${{ secrets.DEPLOY_TOKEN }} --prod=false
      # e.g., AWS: aws s3 sync .next/static s3://staging-bucket
      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging: ${{ vars.STAGING_URL }}"
          echo "Deploy token present: ${{ secrets.DEPLOY_TOKEN != '' }}"
          # TODO: replace with actual deploy command, e.g.:
          # npx vercel --token ${{ secrets.DEPLOY_TOKEN }} --yes
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
