[package]
name = "arenax-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON Schema validation (used by src/validators/json_schema.rs)
jsonschema = "0.28"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "json"] }
validator = { version = "0.20.0", features = ["derive"] }
rust_decimal = { version = "1.40.0", features = ["db-postgres"] }
actix-web = "4.12.1"
jsonwebtoken = "9.2"
bcrypt = "0.15"
actix = "0.13"
actix-web-actors = "4.3"
anyhow = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-http = "0.32"
sha2 = "0.10"
hmac = "0.12"
dotenvy = "0.15"
actix-cors = "0.6"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
fs2 = "0.4"
once_cell = "1.19"
prometheus = { version = "0.13", features = ["process"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
# sqlx's ConnectOptions::log_slow_statements/log_statements take log::LevelFilter (#1084)
log = "0.4"


# Security: pin patched versions of transitive deps
quinn-proto = "0.11.14"
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "debug-images"] }
sentry-actix = "0.49.3"
sentry-tracing = "0.49.3"

[dev-dependencies]
tokio-test = "0.4"
# Cross-service contract tests (#102): drive the Rust implementation with the
# shared versioned API contract fixtures and assert status/schema behavior.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1.0"
jsonschema = "0.28"
# Property tests for tournament bracket invariants (#103): generate participant
# counts, seeds, byes, and result orders, then assert uniqueness/advancement.
proptest = "1.4"
# Property tests for matchmaking fairness and uniqueness (#104): generate
# players with ratings/games/regions/wait times and cancellation events, then
# assert queue/pairing invariants (no double-assignment, eligibility, release).
proptest = "1.4"
# Fuzz/property tests for financial parsing and amount boundaries (#105):
# generate malformed decimal strings, webhook payloads, and Soroban
# amount/weight values, then assert no panics, no silent rounding beyond the
# documented currency policy, and validate-before-mutate ordering.
proptest = "1.4"
# Deterministic, bounded fuzzing harness for the #105 targets (seeded corpus,
# fixed iteration counts, reproducible in CI).
libfuzzer-sys = { version = "0.4", optional = true }

[features]
# Enable with `cargo test --features fuzz` to run the bounded fuzz harness.
fuzz = ["libfuzzer-sys"]
